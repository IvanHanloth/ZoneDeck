# octo-sts 信任策略：release.yml 以 OIDC 身份向 https://octo-sts.dev 换取
# 本仓库 contents:write 的短期 token（见 release.yml 的 Federate token 步骤）。
# 只放行 main / dev 分支上的工作流运行。
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:IvanHanloth/ZoneDeck:ref:refs/heads/(main|dev)

permissions:
  contents: write
