name: Build & Test

on:
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/docs/**", "**/.github/workflows/deploy-docs.yml"] # 文档部署不需要跑测试
  push:
    tags-ignore: ["**"] # tag 由 release.yml 负责，别重复跑
    paths-ignore: ["**/docs/**", "**/.github/workflows/deploy-docs.yml"] # 文档部署不需要跑测试
  workflow_dispatch:

# 同一分支上有新推送时，取消还在跑的旧任务
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/config/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ---- 版本号：四处文件是否一致（手改 Cargo.toml 后忘了同步的话在这里挡下）----
      - name: Version consistency check
        shell: pwsh
        run: ./scripts/version.ps1 check

      # ---- 前端：依赖 / 单元测试 / 构建 ----
      - name: Frontend install, test & build
        run: |
          npm --prefix apps/config/ui ci
          npm --prefix apps/config/ui test
          npm --prefix apps/config/ui run build

      # ---- Rust：格式 / 静态检查 / 测试 / 生产编译 ----
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

      - name: Upload binaries (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: bosskey-binaries
          path: |
            target/release/core.exe
            target/release/bosskey-config.exe
          retention-days: 7
