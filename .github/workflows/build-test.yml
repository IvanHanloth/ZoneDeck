name: Buildup Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - refactor/rust-rewrite
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/config/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ---- 前端：依赖 / 单元测试 / 构建 ----
      - name: Frontend install, test & build
        run: |
          npm --prefix apps/config/ui ci
          npm --prefix apps/config/ui test
          npm --prefix apps/config/ui run build

      # ---- Rust：格式 / 静态检查 / 测试 / 生产编译 ----
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

      - name: Upload binaries (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: bosskey-binaries
          path: |
            target/release/bosskey-core.exe
            target/release/bosskey-config.exe
          retention-days: 7
