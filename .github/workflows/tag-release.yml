name: Release New Version

on:
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/config/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ---- 版本号：标签 → 四段式（v3.0.1 → 3.0.1.0） ----
      - name: Derive version from tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '[^0-9.]', ''
          $parts = $tag.Split('.', [StringSplitOptions]::RemoveEmptyEntries)
          while ($parts.Length -lt 4) { $parts += '0' }
          $version = ($parts[0..3] -join '.')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "版本号：$version"

      # ---- 前端 ----
      - name: Frontend install, test & build
        run: |
          npm --prefix apps/config/ui ci
          npm --prefix apps/config/ui test
          npm --prefix apps/config/ui run build

      # ---- Rust 测试 ----
      - name: Tests
        run: cargo test --workspace

      # ---- 一键打包：cargo release 编译 + 便携文件夹 + InnoSetup 安装包 ----
      # windows-latest 运行器预装 Inno Setup（ISCC.exe）
      - name: Package portable folder & installer
        shell: pwsh
        run: powershell -File scripts/package.ps1 -SkipFrontend -Installer -Version $env:VERSION

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "package/Boss-Key" `
            -DestinationPath "package/Boss-Key-${{ github.ref_name }}-portable.zip"

      # ---- 代码签名（可选，反杀软误报最有效的单项措施）----
      # 取得 OV/EV 证书后：PFX 以 base64 存入 secrets.CODE_SIGN_PFX，
      # 密码存入 secrets.CODE_SIGN_PASSWORD，再取消下方步骤注释。
      # - name: Sign binaries
      #   shell: pwsh
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX }}"))
      #     $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
      #     & $signtool sign /f cert.pfx /p "${{ secrets.CODE_SIGN_PASSWORD }}" `
      #       /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
      #       package/Boss-Key/bosskey-core.exe package/Boss-Key/bosskey-config.exe `
      #       "package/installer/Boss-Key-$env:VERSION-Setup.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Boss Key ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            package/Boss-Key-${{ github.ref_name }}-portable.zip
            package/installer/Boss-Key-*-Setup.exe
