name: Release

# 一键发版：写版本号 → 经 GitHub API 创建带 Verified 签名的提交 → 打 tag → 构建 → 草稿 Release。
#
# 推送凭据来自 octo-sts（https://octo-sts.dev）：工作流以 OIDC 身份向其换取一个
# 只限本仓库、仅 contents:write 的短期 token，job 结束时自动吊销，仓库不保存
# 任何长期凭据。信任策略见 .github/chainguard/tag-release.sts.yaml。
#
# 版本号提交与 tag 直接落在触发分支上（请从 main 触发）。Octo STS App 已加入
# 分支保护的 bypass 名单，无需发版 PR。提交经 GraphQL createCommitOnBranch 创建，
# 由 GitHub 服务端签名（Verified 徽章）；tag 没有服务端签名机制，是普通附注 tag。
#
# 重跑 / 补发：填入已发过的版本号即可 —— tag 已存在时跳过提交与打 tag，
# 直接检出该 tag 重新构建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，例如 3.0.1 或 3.1.0-rc.1（可带前导 v）；对应 tag 已存在时仅重新构建"
        required: true
        type: string

permissions:
  contents: write # 创建 Release
  id-token: write # octo-sts 换 token 与 attest-build-provenance 都依赖 OIDC token
  attestations: write # 写入构建来源证明

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 先写版本号再判断新发版还是重建：借用 version.ps1 的归一化
      # （去前导 v、折叠四段号），避免在工作流里重复实现一遍
      - name: Apply version to files
        id: bump
        shell: pwsh
        run: ./scripts/version.ps1 apply "${{ inputs.version }}"

      - name: Determine release mode
        id: mode
        shell: pwsh
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          git ls-remote --tags --exit-code origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "tag $tag 已存在，本次仅重新构建"
            $rebuild = 'true'
          } else {
            Write-Host "tag $tag 不存在，本次为新发版"
            $rebuild = 'false'
          }
          @("tag=$tag", "rebuild=$rebuild") | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # ls-remote 在 tag 不存在时返回 2，而 pwsh 步骤以最后一条原生命令的
          # 退出码收尾，这里显式归零
          exit 0

      # 以 OIDC 身份向 octo-sts 换取本仓库 contents:write 的短期 token，
      # job 结束时由该 action 的 post 步骤吊销
      - name: Federate token via octo-sts
        if: steps.mode.outputs.rebuild != 'true'
        id: sts
        uses: octo-sts/action@main
        with:
          scope: ${{ github.repository }}
          identity: tag-release

      # 经 GraphQL createCommitOnBranch 提交版本号变更：GitHub 会在服务端为
      # API 创建的提交签名（Verified 徽章），这是不保管签名私钥的前提下唯一的
      # 签名途径。expectedHeadOid 保证分支头未被并发移动，否则失败而不是覆盖。
      - name: Create verified commit and tag
        if: steps.mode.outputs.rebuild != 'true'
        shell: pwsh
        env:
          STS_TOKEN: ${{ steps.sts.outputs.token }}
          TAG: ${{ steps.mode.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $headers = @{ Authorization = "Bearer $env:STS_TOKEN"; 'Content-Type' = 'application/json' }

          # 版本号只落在这两处，其余地方构建时取自 Cargo.toml（见 scripts/version.ps1）
          $files = @(
            'Cargo.toml',
            'Cargo.lock'
          )
          $additions = foreach ($f in $files) {
            @{ path = $f; contents = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f)) }
          }

          $body = @{
            query = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
            variables = @{
              input = @{
                branch = @{ repositoryNameWithOwner = $env:GITHUB_REPOSITORY; branchName = $env:BRANCH }
                expectedHeadOid = $env:HEAD_SHA
                message = @{ headline = "chore(release): $env:TAG" }
                fileChanges = @{ additions = @($additions) }
              }
            }
          } | ConvertTo-Json -Depth 12 -Compress

          $resp = Invoke-RestMethod -Uri 'https://api.github.com/graphql' -Method Post -Headers $headers -Body $body
          if ($resp.errors) { throw "创建提交失败：$($resp.errors[0].message)" }
          $oid = $resp.data.createCommitOnBranch.commit.oid
          Write-Host "版本号已提交至 $env:BRANCH：$oid"

          # 带 message 的附注 tag
          $tagBody = @{ tag = $env:TAG; message = "ZoneDeck $env:TAG"; object = $oid; type = 'commit' } | ConvertTo-Json -Compress
          $tagObj = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/tags" -Method Post -Headers $headers -Body $tagBody

          $refBody = @{ ref = "refs/tags/$env:TAG"; sha = $tagObj.sha } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/refs" -Method Post -Headers $headers -Body $refBody | Out-Null
          Write-Host "tag $env:TAG 已创建"

      # 构建对象统一为 tag 指向的提交：新发版时它刚经 API 落在远端（本地工作区
      # 内容与之相同，但没有这个提交对象），重建时它就是当年的版本号提交
      - name: Checkout release tag
        shell: pwsh
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          git fetch origin --no-tags "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          if ($LASTEXITCODE -ne 0) { throw "拉取 tag $env:TAG 失败" }
          git checkout -f "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "检出 tag $env:TAG 失败" }

      # tag 与代码里的版本号必须一致，否则装出来的包版本号是错的
      - name: Verify version matches tag
        id: version
        shell: pwsh
        run: ./scripts/version.ps1 check "${{ steps.mode.outputs.tag }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/config/ui/pnpm-lock.yaml

      - name: Frontend install, test & build
        run: |
          pnpm --dir apps/config/ui install --frozen-lockfile
          pnpm --dir apps/config/ui test
          pnpm --dir apps/config/ui run build

      - name: Rust tests
        run: cargo test --workspace

      # 便携文件夹（dist/ZoneDeck/）+ InnoSetup 安装包（dist/installer/）。
      # package.ps1 会调 install-inno.ps1 按需装 Inno Setup 7，
      # 版本号则由它从 Cargo.toml 读取，这里不用再传。
      - name: Package portable folder & installer
        shell: pwsh
        run: ./scripts/package.ps1 -SkipFrontend -Installer

      # 压 dist/ZoneDeck 文件夹本身（而非其中的文件），解压后得到一个 ZoneDeck 目录，
      # 不会把 exe 散落到用户的下载目录里。
      - name: Zip portable build
        shell: pwsh
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: Compress-Archive -Path "dist/ZoneDeck" -DestinationPath "ZoneDeck-$env:TAG-portable.zip"

      # 构建来源证明（Sigstore）：证明产物由本仓库的本 workflow 从该 commit 构建。
      # 用户可用 gh attestation verify <文件> -R IvanHanloth/ZoneDeck 核验。
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/installer/ZoneDeck-*-Setup.exe
            ZoneDeck-${{ steps.mode.outputs.tag }}-portable.zip

      # ---- 代码签名（可选，反杀软误报最有效的单项措施）----
      # 取得 OV/EV 证书后：PFX 以 base64 存入 secrets.CODE_SIGN_PFX，
      # 密码存入 secrets.CODE_SIGN_PASSWORD，再取消下方步骤注释。
      # 注意：签名要拆成两步，且都得排在打包之前 —— 先签 dist/ZoneDeck 里的 exe，
      # 再跑 package.ps1 -Installer 把已签名的 exe 装进安装包，最后单独签安装包本身，
      # 否则 zip / 安装包里装的仍是未签名的二进制。
      # - name: Sign binaries
      #   shell: pwsh
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX }}"))
      #     $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
      #     & $signtool sign /f cert.pfx /p "${{ secrets.CODE_SIGN_PASSWORD }}" `
      #       /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
      #       "dist/ZoneDeck/ZoneDeck.exe" dist/ZoneDeck/config.exe dist/installer/ZoneDeck-*-Setup.exe

      # 发布说明 = GitHub 自动生成的更新日志 + 结尾的安全提示。
      # 创建 Release 时若同时传 body 和 generate_release_notes，自定义内容只会被
      # 放在自动生成内容**之前**，所以这里先调 generate-notes API 拿到更新日志，
      # 再手动把安全提示拼在末尾。
      - name: Compose release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          $notes = (gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$env:TAG" --jq '.body') -join "`n"
          $notice = @'
          > [!WARNING]
          > 【安全提示】
          > 本软件中运用了大量的系统底层API，并且提供开机自启、热键监控、窗口冻结等功能，容易被杀毒软件识别为木马病毒，但是程序本身完全开源、免费，并不包含病毒、木马行为，请放心使用。请务必从官方渠道下载和使用程序，运行程序前通过文件哈希、文件签名等方式验证文件的真实性，谨防利用软件信任伪装的病毒程序。
          '@
          Set-Content -Path release-notes.md -Value ($notes + "`n`n" + $notice) -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZoneDeck ${{ steps.mode.outputs.tag }}
          tag_name: ${{ steps.mode.outputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.is_prerelease != 'true' }}
          files: |
            ZoneDeck-${{ steps.mode.outputs.tag }}-portable.zip
            dist/installer/ZoneDeck-*-Setup.exe
