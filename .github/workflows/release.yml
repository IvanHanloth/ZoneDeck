name: Release

# 构建并发布一个已随合并进入 main 的 tag。
#
# 触发方式：
#   1. 推送到 main —— tag.yml 事先把版本号提交与 v* tag 落在 dev，等 dev → main 的
#      PR 合并，tag 随之进入 main 的历史，这里检测到就构建；
#   2. 手动触发（workflow_dispatch），指定 tag —— 用于重跑或补发。
#
# 为什么不监听 push: tags：tag 是 tag.yml 用 GITHUB_TOKEN 推到 dev 的，那次推送
# 不会触发任何工作流；而 PR 合并本身**不产生 tag 推送事件**（tag 是独立的 ref，
# 合并只是让它指向的提交变得可从 main 追溯）。所以只能从 main 的 push 事件里检测。

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建发布的 tag，例如 v3.0.1"
        required: true
        type: string

jobs:
  # 找出「这次推送新带进 main 的 v* tag」。
  # 不能用「HEAD 上挂着的 tag」：merge commit 才是 HEAD，tag 指向的是它的父提交。
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史与全部 tag 才能算可达性

      - name: Find newly merged release tag
        id: find
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            echo "手动指定：${INPUT_TAG}"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 推送前 main 上已可追溯的 v* tag。新建分支 / 强推时 before 可能不可用，
          # 那就当作「之前一个都没有」，让下面取到最新的一个。
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git tag --merged "${BEFORE}" --list 'v*' | sort > /tmp/before.txt
          else
            : > /tmp/before.txt
          fi
          git tag --merged HEAD --list 'v*' | sort > /tmp/after.txt

          # 一次合并正常只带进一个；真有多个就取版本号最大的
          tag=$(comm -13 /tmp/before.txt /tmp/after.txt | sort -V | tail -n 1)

          if [ -z "$tag" ]; then
            echo "本次推送没有新的 v* tag 进入 main，跳过发布"
          else
            echo "检测到新进入 main 的 tag：$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: detect
    if: needs.detect.outputs.tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write # attest-build-provenance 取 OIDC token
      attestations: write # 写入构建来源证明
    concurrency:
      group: release-${{ needs.detect.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.detect.outputs.tag }}

    steps:
      # 构建 tag 指向的那个提交，而不是 main 的 merge commit：
      # 前者才是版本号提交本身，与 version.ps1 check 的校验对象一致。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}

      # tag 与代码里的版本号必须一致，否则装出来的包版本号是错的
      - name: Verify version matches tag
        id: version
        shell: pwsh
        run: ./scripts/version.ps1 check "$env:TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/config/ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Frontend install, test & build
        run: |
          npm --prefix apps/config/ui ci
          npm --prefix apps/config/ui test
          npm --prefix apps/config/ui run build

      - name: Rust tests
        run: cargo test --workspace

      # 便携文件夹（dist/Boss-Key/）+ InnoSetup 安装包（dist/installer/）。
      # package.ps1 会调 install-inno.ps1 按需装 Inno Setup 7，
      # 版本号则由它从 Cargo.toml 读取，这里不用再传。
      - name: Package portable folder & installer
        shell: pwsh
        run: ./scripts/package.ps1 -SkipFrontend -Installer

      # 压 dist/Boss-Key 文件夹本身（而非其中的文件），解压后得到一个 Boss-Key 目录，
      # 不会把 exe 散落到用户的下载目录里。
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path "dist/Boss-Key" -DestinationPath "Boss-Key-$env:TAG-portable.zip"

      # 构建来源证明（Sigstore）：证明产物由本仓库的本 workflow 从该 commit 构建。
      # 用户可用 gh attestation verify <文件> -R IvanHanloth/Boss-Key 核验。
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/installer/Boss-Key-*-Setup.exe
            Boss-Key-${{ env.TAG }}-portable.zip

      # ---- 代码签名（可选，反杀软误报最有效的单项措施）----
      # 取得 OV/EV 证书后：PFX 以 base64 存入 secrets.CODE_SIGN_PFX，
      # 密码存入 secrets.CODE_SIGN_PASSWORD，再取消下方步骤注释。
      # 注意：签名要拆成两步，且都得排在打包之前 —— 先签 dist/Boss-Key 里的 exe，
      # 再跑 package.ps1 -Installer 把已签名的 exe 装进安装包，最后单独签安装包本身，
      # 否则 zip / 安装包里装的仍是未签名的二进制。
      # - name: Sign binaries
      #   shell: pwsh
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX }}"))
      #     $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
      #     & $signtool sign /f cert.pfx /p "${{ secrets.CODE_SIGN_PASSWORD }}" `
      #       /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
      #       "dist/Boss-Key/Boss Key.exe" dist/Boss-Key/config.exe dist/installer/Boss-Key-*-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Boss Key ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.is_prerelease != 'true' }}
          files: |
            Boss-Key-${{ env.TAG }}-portable.zip
            dist/installer/Boss-Key-*-Setup.exe
